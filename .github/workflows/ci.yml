name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma validates the URL format during CI; no database connection is made.
      DATABASE_URL: mysql://nexus:nexus@127.0.0.1:3306/nexus_operations
      JWT_SECRET: ci-only-placeholder-secret-with-minimum-length
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build all workspaces
        run: npm run build
